name: Relatório mensal
# Todo dia 2 compara o modelo com a Hashtag na temporada atual. Só acompanhamento, não altera parâmetros.
on:
  schedule:
    - cron: '23 13 2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/monitor.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar no repositório
        run: |
          git config user.name "Rotina da calculadora"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Relatório mensal $(date -u +%F)" && git push)
