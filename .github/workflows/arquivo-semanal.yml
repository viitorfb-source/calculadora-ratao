name: Arquivo semanal
# Toda segunda-feira salva o ranking da Hashtag e um resumo da ESPN em data/snapshots
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arquivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/snapshot.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "Rotina da calculadora"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Arquivo semanal $(date -u +%F)" && git push)
